# Imposter mock for the agent content CDN.
#
# Serves discovery, /agents/*, and /artefacts/* with permissive CORS so the
# CLI (and any local browser tooling) can fetch without cross-origin errors.
#
# Start:  imposter up             (from mocks/)
# Stop:   imposter down -a

plugin: rest

cors:
  allowOrigins: all

resources:
  # --- Discovery document at well-known path --------------------------------
  - path: /.well-known/agents/discovery.json
    method: GET
    response:
      file: .well-known/agents/discovery.json
      delay:
        exact: 500

  # --- Serve all files under /agents/ from the agents/ directory ------------
  - path: /agents/*
    method: GET
    response:
      dir: agents
      delay:
        exact: 500

  # --- Serve artefact zips from the artefacts/ directory -------------------
  - path: /artefacts/*
    method: GET
    response:
      dir: artefacts
      delay:
        exact: 500
