openapi: 3.0.3
info:
  title: Backend API
  description: >
    Subset of the authenticated backend REST API used by Agent Manager
    (My Projects): list and fetch projects only.
  version: "1.0.0"

servers:
  - url: http://localhost:8080
    description: Local Imposter mock (same host as discovery / agent content)

tags:
  - name: projects

paths:
  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: List projects the authenticated user can access
      responses:
        "200":
          description: Accessible projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"

  /projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      tags: [projects]
      operationId: getProject
      summary: Get a single project
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    projectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"

  schemas:
    ErrorBody:
      type: object
      properties:
        message:
          type: string

    Project:
      type: object
      required:
        - id
        - teamId
        - name
        - toolIds
        - adminEmails
        - restrictAgents
        - restrictSkills
        - allowedAgentIds
        - allowedSkillIds
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        teamId:
          type: string
        name:
          type: string
        description:
          type: string
        toolIds:
          type: array
          items:
            type: string
        adminEmails:
          type: array
          items:
            type: string
            format: email
        restrictAgents:
          type: boolean
          description: When true, only allowedAgentIds may be used
        restrictSkills:
          type: boolean
          description: When true, only allowedSkillIds may be used
        allowedAgentIds:
          type: array
          items:
            type: string
          description: Catalogue agent directory names
        allowedSkillIds:
          type: array
          items:
            type: string
          description: Catalogue skill directory names
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
