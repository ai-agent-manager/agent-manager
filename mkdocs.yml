# Agent Manager documentation site
#
# Local preview:  ./scripts/docs.sh
# Build only:     ./scripts/docs.sh build
# Published at:   https://ai-agent-manager.github.io/agent-manager/

site_name: Agent Manager
site_description: >-
  Install and manage versioned AI agent skills and Rovo agents across
  Claude Code, Cursor, GitHub Copilot, Kiro, and Devin Desktop.
site_author: Agent Manager
site_url: https://ai-agent-manager.github.io/agent-manager/

repo_name: ai-agent-manager/agent-manager
repo_url: https://github.com/ai-agent-manager/agent-manager
edit_uri: edit/main/docs/

copyright: Copyright &copy; Agent Manager contributors &mdash; Apache-2.0

docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  logo: assets/icon.png
  favicon: assets/icon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline
    view: material/eye-outline

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ai-agent-manager/agent-manager
      name: GitHub repository
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/@ai-agent-manager/cli
      name: npm package

plugins:
  - search:
      lang: en
  - git-revision-date-localized:
      enabled: !ENV [CI, false]
      enable_creation_date: true
      type: date
      fallback_to_build_date: true
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto
      zoomable: true
      draggable: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Discovery: discovery.md
      - Bundle format: bundle-format.md
      - Atlassian auth: atlassian-auth.md
      - Chrome extension: chrome-extension-install.md
      - Telemetry: telemetry.md
  - Maintainers:
      - Publishing: publishing.md
      - Previewing docs: docs-preview.md
