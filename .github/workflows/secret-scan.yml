name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan full history, not just the tip commit

      # Private extra rules (internal hostnames etc.) can be supplied without
      # ever appearing in this public repo: put the full TOML content in a repo
      # secret named BETTERLEAKS_CONFIG_TOML (betterleaks reads that env var as
      # the config itself). Start it with [extend] useDefault = true.
      - name: Run betterleaks
        env:
          BETTERLEAKS_CONFIG_TOML: ${{ secrets.BETTERLEAKS_CONFIG_TOML }}
        run: |
          [ -n "$BETTERLEAKS_CONFIG_TOML" ] || unset BETTERLEAKS_CONFIG_TOML
          set +e
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -e BETTERLEAKS_CONFIG_TOML \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/betterleaks/betterleaks:latest \
            git /repo --redact --no-banner -v -f json -r /repo/betterleaks-report.json
          status=$?
          set -e
          # Print file/rule only (secret values stay out of logs).
          python3 - <<'PY'
          import json, pathlib, sys
          path = pathlib.Path('betterleaks-report.json')
          if not path.exists():
              print('no report written')
              sys.exit(0)
          findings = json.loads(path.read_text())
          if not isinstance(findings, list):
              findings = [findings]
          for i, finding in enumerate(findings, 1):
              print(f"finding {i}:")
              for key in ('RuleID', 'Description', 'File', 'StartLine', 'EndLine', 'Commit', 'Fingerprint'):
                  if finding.get(key) not in (None, ''):
                      print(f"  {key}: {finding[key]}")
          print(f"total: {len(findings)}")
          PY
          rm -f betterleaks-report.json
          exit "$status"
