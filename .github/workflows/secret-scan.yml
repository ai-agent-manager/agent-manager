name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need full history for base..head / before..sha ranges

      # Private extra rules (internal hostnames etc.) can be supplied without
      # ever appearing in this public repo: put the full TOML content in a repo
      # secret named BETTERLEAKS_CONFIG_TOML (betterleaks reads that env var as
      # the config itself). Start it with [extend] useDefault = true.
      - name: Run betterleaks
        env:
          BETTERLEAKS_CONFIG_TOML: ${{ secrets.BETTERLEAKS_CONFIG_TOML }}
          # checkout with fetch-depth:0 fetches every remote branch; without
          # --log-opts betterleaks would scan unrelated branches (e.g. feature
          # branches with test fixtures) and fail this PR for their findings.
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          [ -n "$BETTERLEAKS_CONFIG_TOML" ] || unset BETTERLEAKS_CONFIG_TOML
          if [ "$EVENT_NAME" = "pull_request" ]; then
            LOG_OPTS="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            LOG_OPTS="$PUSH_SHA"
          else
            LOG_OPTS="${PUSH_BEFORE}..${PUSH_SHA}"
          fi
          echo "Scanning commits: $LOG_OPTS"
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -e BETTERLEAKS_CONFIG_TOML \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/betterleaks/betterleaks:latest \
            git /repo --redact --no-banner --log-opts="$LOG_OPTS"
